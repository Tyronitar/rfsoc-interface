[loggers]
keys=root,telescopeControl,rfsocinterface

[handlers]
keys=consoleHandler,fileHandler,telescopeFileHandler

[formatters]
keys=consoleFormatter,debugFormatter,telescopeDebugFormatter


[logger_root]
level=WARNING
handlers=consoleHandler,fileHandler

[logger_rfsocinterface]
handlers=consoleHandler,fileHandler
level=DEBUG
qualname=rfsocinterface
propagate=0

[logger_telescopeControl]
level=DEBUG
handlers=consoleHandler,telescopeFileHandler
qualname=rfsocinterface.telescopeControl
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=consoleFormatter
args=(sys.stdout,)

[formatter_consoleFormatter]
format=%(asctime)s - %(message)s
class=rfsocinterface.logging_utils.CustomConsoleFormatter

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=debugFormatter
args=(os.path.expanduser('~') + '/.rfsocinterface/rfsocinterface.log', 'a', 10485760, 5)

[handler_telescopeFileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=telescopeDebugFormatter
args=(os.path.expanduser('~') + '/.rfsocinterface/telescope.log', 'a', 10485760, 5)

[formatter_debugFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s (%(filename)s:%(lineno)d)

[formatter_telescopeDebugFormatter]
format=%(asctime)s - %(levelname)s - %(message)s (%(filename)s:%(lineno)d)
