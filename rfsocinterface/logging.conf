[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=consoleFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=detailedFormatter
args=(sys.stdout,)

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(funcName)s - %(message)s

[handler_fileHandler]
class=RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('~/.rfsocinterface/rfsocinterface.log', 'a', maxBytes=10485760, backupCount=5)