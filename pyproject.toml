# ========== Poetry Settings ==========

[tool.poetry]
name = "rfsocinterface"
version = "0.4.2"
description = "A user-friendly GUI for configuring and monitoring MKID readout software"
authors = ["Nia McNichols <niamcnichols@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
matplotlib = "^3.9.2"
redis = ">=5.0.8"
h5py = "^3.12.1"
uldaq = "^1.2.3"
pymodbustcp = "^0.3.0"
scikit-learn = "^1.5.2"
opencv-python = "^4.10.0.84"
kidpy3 = {git = "https://github.com/ASU-Astronomical-Instrumentation/readout.git", branch="main"}
exscript = "^2.6.28"
psutil = "^6.1.1"
vmbpy = "^1.1.0"
gitpython = "^3.1.44"
numpy = "^2.3.1"
scipy = "^1.16.0"
telnetlib3 = "^2.0.8"
shiboken6 = "^6.8.1"
qtawesome = "^1.3.1"
pyside6 = "^6.8.2"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.1,<0.16"
mypy = "^1.11.1"
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
pytest-xdist = "^3.6.1"
pytest-mock = "^3.14.0"
coverage = {extras = ["toml"], version = "^7.6.1"}
pytest-qt = "^4.4.0"
memray = "^1.17.2"
snakeviz = "^2.2.2"
pyside6-addons = "^6.8.1"
av = "^17.0.1"
pdfjs-viewer-pyside6 = "^1.2.1.1"
pytest-datafiles = "^3.0.1"


[[tool.poetry.source]]
name = "numpy-mkl"
url = "https://urob.github.io/numpy-mkl"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ========== Ruff Settings ==========

[tool.ruff]
target-version = "py312"
include = [
    "pyproject.toml",
    "rfsocinterface/*.py",
    "tests/*.py",
]
extend-exclude = [
    "rfsocinterface/gui/uic/*",
    "old_kidpy",
]
fix = true
show-fixes = true

# Same as Black.
line-length = 88

indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "BLE", "FBT", "B", "A", "COM",
    "C4", "ISC", "ICN", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID",
    "ARG", "ERA", "PL", "TRY", "NPY", "PERF", "FURB", "RUF"]
ignore = [
    "ANN",  # Type hints / annotations; handled by mypy
    "COM812",  # "Trailing Comma Missing"
    "TRY003",  # "Avoid specifying long messages outside the exception class"
    "PLR0913",  # Too many arguments to function call
    "FBT001",  # Boolean-typed positional argument in function definitions
    "FBT002",  # Boolean default positional argument in function definitions
    "FBT003",  # Boolean positional value in function call,
    "ERA001",  # Commented-out code
    "ISC001", # Single-line implicitly string concatenation
    "N812", # Lowercase imports that are aliased to non-lowercase names
    "F405", # undefined local with import start usage
]

task-tags = [
    "TODO",
    "NOTE",
    "FIXME",
    "XXX"
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

extend-safe-fixes = [
    "B006",
    "C408",
    "C400",
    "D415",
    "PLC0414",
    "PLR1714",
    "RET503",
    "RET504",
    "RUF013",
    "SIM102",
    "SIM105",
    "SIM117",
    "W291",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"
parametrize-values-type = "list"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "setData",
    "headerData",
    "rowCount",
    "columnCount",
    "*mK*",
    "*IQ*",
    "*_IQ_*",
    "*_IQ",
    "*_{I,Q}",
    "*_{I,Q}_*",
    "*Hz*",
    "*dB*",
    "*TOD*",
]

[tool.ruff.lint.pylint]
max-branches = 20
max-statements = 100

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

property-decorators = ["abc.abstractproperty"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# ========== Pytest Settings ==========

[tool.pytest.ini_options]
markers = [
    "smoke: these tests should always run to check for regressions quickly",
]

testpaths = ["tests"]

filterwarnings = [
    'ignore::DeprecationWarning:multiprocessing',
]

# ========== Coverage Settings ==========

[tool.coverage.run]
branch = true
source = ["rfsocinterface"]
omit = [
    "*tests*",
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "__str__",
    "loggig.debug",
    "logging.info",
    "logging.warning",
    "pass",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

ignore_errors = true
show_missing = true
fail_under = 70

# ========== MyPy Settings ==========

[tool.mypy]
files = "rfsocinterface"
exclude = [
    'ui_.*\.py$',  # Ignore files starting with 'ui_'
]
show_error_codes = true
show_error_code_links = true
