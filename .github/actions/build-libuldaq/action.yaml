name: Build libuldaq
description: "Build libuldaq for testing, reusing a cached build when one exists"

inputs:
  version:
    description: "which libuldaq release to build"
    default: "1.2.2"
  build-revision:
    description: "Bump this when the build steps change, to force a rebuild"
    default: "2"

runs:
  using: "composite"
  steps:
    - name: Get OS release
      id: os
      shell: bash
      run: echo "release=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    # Only the installed files are cached. Running make on a cached build tree
    # recompiles it, because the tree depends on headers that a cache hit doesn't
    # install.
    - name: Restore libuldaq build
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/libuldaq-${{ inputs.version }}-stage
        key: libuldaq-${{ inputs.version }}-${{ steps.os.outputs.release }}-${{ runner.arch }}-r${{ inputs.build-revision }}

    - name: Install build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libusb-1.0-0-dev autotools-dev automake libtool wget

    - name: Download and build libuldaq
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        wget https://github.com/mccdaq/uldaq/releases/download/v${{ inputs.version }}/libuldaq-${{ inputs.version }}.tar.bz2
        tar -xjf libuldaq-${{ inputs.version }}.tar.bz2
        cd libuldaq-${{ inputs.version }}
        ./configure
        make -j"$(nproc)"
        # Install from src only: the top-level install hook runs udevadm and
        # ldconfig, which fail in a staged install, and CI needs no udev rules.
        make -C src install DESTDIR="$RUNNER_TEMP/libuldaq-${{ inputs.version }}-stage"

    - name: Install libusb runtime
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if ! /sbin/ldconfig -p | grep -q 'libusb-1\.0\.so\.0'; then
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0
        fi

    - name: Install libuldaq
      shell: bash
      run: |
        sudo cp -a --no-preserve=ownership "$RUNNER_TEMP/libuldaq-${{ inputs.version }}-stage/usr/local/." /usr/local/
        sudo ldconfig
