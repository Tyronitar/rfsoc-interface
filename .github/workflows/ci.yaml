name: CI
on:
  pull_request:
  # Caches saved in a pull request are only visible to that pull request.
  # Running on main saves caches that every pull request can restore, and
  # running on dev saves caches for pull requests that target dev.
  push:
    branches: [main, dev]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
            sudo apt install -y libegl1-mesa-dev
      
      - name: Install libuldaq
        uses: ./.github/actions/build-libuldaq

      - name: Install Python
        id: setup-python
        uses: actions/setup-python@v4
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install poetry
        uses: abatilo/actions-poetry@v4
      
      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Define a cache for the virtual environment based on the dependencies lock file
        uses: actions/cache@v6
        with:
          path: ./.venv
          # The venv links to the exact Python build, so a new patch version needs a new venv.
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install the project dependencies
        run: poetry install
    
      - name: Make UI files
        run: make all

      - name: Lint Code
        uses: astral-sh/ruff-action@v4.0.0

      - name: Format Code
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "format --check"

      - name: Run Test Suite
        run: poetry run pytest
