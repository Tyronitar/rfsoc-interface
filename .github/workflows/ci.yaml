name: CI
on: pull_request

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
            sudo apt update && sudo apt install -y libegl1-mesa-dev

      - name: Install poetry
        uses: abatilo/actions-poetry@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
            python-version: ${{ matrix.python-version }}
            cache: 'poetry'

      - name: Install the project dependencies
        run: poetry install
    
      - name: Make UI files
        run: make all

      - name: Lint Code
        uses: astral-sh/ruff-action@v4.0.0

      - name: Format Code
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "format --check"

      - name: Run Test Suite
        run: poetry run pytest
